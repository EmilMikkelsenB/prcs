services:
  host:
    build:
      context: .
      dockerfile: docker/host.Dockerfile
    ports:
      - "${HOST_PORT:-8088}:8088"
    environment:
      # Default points at the runner's standard static IP below. Override to
      # target a runner anywhere else (another host, a bare-metal box, a
      # different compose stack) — any reachable http://<ip>:<port> works.
      RUNNER_URL: ${RUNNER_URL:-http://172.28.0.10:8089}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
    volumes:
      - host_data:/app/data
      - ${KB_PATH:-./kb}:/app/kb   # real folder for the knowledge base
      - ./.env:/app/.env           # lets the Settings page edit .env
    networks:
      alh:
    depends_on:
      - runner

  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    # No published port to the outside world — only reachable at its static
    # IP over the internal compose network below.
    volumes:
      - claude_creds:/root/.claude
      - runner_workspace:/workspace
    networks:
      alh:
        ipv4_address: 172.28.0.10

networks:
  alh:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  host_data:
  claude_creds:
  runner_workspace:
